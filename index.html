<style>
/* Build monitor — tokens follow the mvn-perf data-viz palette (light + dark by prefers-color-scheme). */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --link: #1c5cab;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-text: #006300;
  --bar-success: #0ca30c;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.06);
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255, 255, 255, 0.10); --link: #86b6ef;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    --good-text: #0ca30c; --bar-success: #0ca30c;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255, 255, 255, 0.10); --link: #86b6ef;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  --good-text: #0ca30c; --bar-success: #0ca30c;
  --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 20px; }
h2 { font-size: 16px; }
h3 { font-size: 14px; color: var(--ink-2); }
.bm-noscript { padding: 24px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- shell ---------------------------------------------------------------- */
.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.top .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.top .brand a.title { color: var(--ink); font-weight: 700; font-size: 16px; }
.top .brand .repo { color: var(--ink-2); }
.top nav { display: flex; gap: 4px; margin-left: 8px; }
.top nav a { padding: 6px 10px; border-radius: 8px; color: var(--ink-2); }
.top nav a.active, .top nav a:hover { background: var(--surface-2); color: var(--ink); text-decoration: none; }
.top .meta { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; }
main { padding: 18px 24px 40px; max-width: 1500px; margin: 0 auto; }
footer { padding: 12px 24px 28px; color: var(--muted); font-size: 12px; text-align: center; }
@media (max-width: 700px) { .top, main { padding-left: 12px; padding-right: 12px; } .top .meta { margin-left: 0; text-align: left; } }

.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 10px; flex-wrap: wrap; }
.crumbs .sep { opacity: 0.6; }
.page-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.page-head .grow { flex: 1 1 320px; min-width: 0; }
.page-head .sub { color: var(--ink-2); margin-top: 3px; }
.page-head .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---- filters -------------------------------------------------------------- */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.filters.extras { margin-bottom: 16px; }
.filters label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.filters select, .filters input[type="search"], .filters input[type="text"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 5px 8px; max-width: 320px; }
.filters input[type="search"] { min-width: 180px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; color: var(--ink-2); background: transparent; border: 0; padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button.active { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.filters .count { color: var(--muted); font-size: 12px; margin-left: auto; }
.filters .toggle input { margin: 0; }

/* ---- tiles & cards --------------------------------------------------------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow); }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
.tile .v small { font-size: 12px; color: var(--ink-2); font-weight: 400; margin-left: 4px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 14px; }
@media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.card .card-head h2 { flex: 0 1 auto; min-width: 0; }
.card .card-head .stats { color: var(--ink-2); font-size: 12px; margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.card .card-head .stats b { color: var(--ink); font-weight: 600; }
.card .card-head select { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 3px 6px; max-width: 260px; }
.chart { position: relative; height: 240px; }
.chart.tall { height: 320px; }
.chart canvas { position: absolute; inset: 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; color: var(--ink-2); font-size: 12px; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend .sw.rect { border-radius: 2px; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
.note { color: var(--muted); font-size: 12px; margin-top: 6px; }
section { margin-top: 22px; }
section > h2 { margin-bottom: 10px; }
section > .sub { color: var(--ink-2); margin: -6px 0 10px; font-size: 13px; }
.notice { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--series-1); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; }
.notice.warn { border-left-color: var(--warning); }
.notice.err { border-left-color: var(--critical); }
.notice h2 { margin-bottom: 6px; }
.notice p { margin: 6px 0; }
.notice pre { background: var(--surface-2); padding: 8px 10px; border-radius: 6px; overflow-x: auto; font-family: var(--mono); font-size: 12px; }
.notice .links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }

/* ---- trends strip ------------------------------------------------------------ */
.trends { margin: 16px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.trends summary { cursor: pointer; padding: 8px 14px; color: var(--ink-2); font-size: 13px; list-style: revert; }
.trends summary b { color: var(--ink); }
.trends .spark-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; padding: 0 12px 12px; }
.spark-card { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.spark-card .t { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spark-card .t button.link { color: var(--ink); font-weight: 600; }
.spark-card .t button.link.active { color: var(--link); }
.spark-card .s { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; }
.spark-card .s b { color: var(--ink); font-weight: 600; }
.spark { position: relative; height: 52px; margin-top: 4px; }
.spark canvas { position: absolute; inset: 0; }

/* ---- badges ---------------------------------------------------------------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 18px; border: 1px solid transparent; white-space: nowrap; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.success { color: var(--good-text); background: color-mix(in srgb, var(--good) 14%, transparent); }
.badge.failure, .badge.timed_out, .badge.startup_failure { color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }
.badge.cancelled, .badge.skipped, .badge.neutral { color: var(--ink-2); background: var(--surface-2); }
.badge.action_required, .badge.stale { color: #8a5a00; background: color-mix(in srgb, var(--warning) 22%, transparent); }
.badge.running { color: var(--link); background: color-mix(in srgb, var(--series-1) 14%, transparent); }
.badge.running .dot { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; line-height: 18px; background: color-mix(in srgb, var(--series-2) 16%, transparent); color: var(--ink); border: 1px solid color-mix(in srgb, var(--series-2) 40%, transparent); white-space: nowrap; }
a.chip:hover { text-decoration: none; background: color-mix(in srgb, var(--series-2) 28%, transparent); }
.chip.muted { background: var(--surface-2); border-color: var(--border); color: var(--muted); font-weight: 500; }
.chip.blue { background: color-mix(in srgb, var(--series-1) 14%, transparent); border-color: color-mix(in srgb, var(--series-1) 40%, transparent); }
a.chip.blue:hover { background: color-mix(in srgb, var(--series-1) 26%, transparent); }
.good { color: var(--good-text); }
.bad { color: var(--critical); }

/* ---- tables ---------------------------------------------------------------- */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; vertical-align: middle; }
th { color: var(--muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 200px; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.group td { background: var(--surface-2); font-weight: 600; padding-top: 8px; padding-bottom: 8px; }
tbody tr.group td .dim, tbody tr.group td .badge { font-weight: 500; }
tbody tr.group .g { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
tbody tr.superseded td { opacity: 0.55; }
tbody tr.step-row td { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); color: var(--ink-2); }
tbody tr.step-row.hidden { display: none; }
tbody tr.step-row td:first-child { padding-left: 34px; }
.dim { color: var(--muted); }
.sha { font-family: var(--mono); font-size: 12px; }
button.link { font: inherit; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; }
button.link:hover { text-decoration: underline; }
button.tgl { font: inherit; font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 1px 7px; cursor: pointer; line-height: 18px; }
button.tgl:hover { background: var(--surface-2); color: var(--ink); }
.table-tools { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 6px 0 8px; color: var(--ink-2); font-size: 12px; }
.table-tools label { display: inline-flex; gap: 6px; align-items: center; }

/* ---- run timeline (Gantt) --------------------------------------------------- */
.timeline { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
.timeline .tl-toolbar { display: flex; gap: 14px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--grid); color: var(--ink-2); font-size: 12px; flex-wrap: wrap; }
.timeline .tl-toolbar label { display: inline-flex; gap: 6px; align-items: center; }
.tl-scroll { overflow-x: auto; }
.tl-grid { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; min-width: 700px; }
.tl-row { display: contents; }
.tl-label, .tl-track { border-bottom: 1px solid var(--grid); min-height: 28px; }
.tl-row.job .tl-label, .tl-row.job .tl-track { background: var(--surface-2); min-height: 32px; }
.tl-label { padding: 4px 10px 4px 12px; display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; position: sticky; left: 0; background: var(--surface); z-index: 1; }
.tl-row.job .tl-label { font-weight: 600; }
.tl-row.step .tl-label { padding-left: 28px; color: var(--ink-2); }
.tl-label .name { overflow: hidden; text-overflow: ellipsis; }
.tl-label .dur { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tl-track { position: relative; }
.tl-bar { position: absolute; top: 7px; height: 14px; border-radius: 4px; background: var(--bar-success); min-width: 2px; }
.tl-row.job .tl-bar { top: 8px; height: 16px; opacity: 0.55; }
.tl-bar.failure, .tl-bar.timed_out, .tl-bar.startup_failure { background: var(--critical); }
.tl-bar.cancelled, .tl-bar.neutral { background: var(--muted); }
.tl-bar.skipped { background: transparent; border: 1px dashed var(--axis); }
.tl-bar.in_progress, .tl-bar.queued, .tl-bar.waiting, .tl-bar.pending { background: repeating-linear-gradient(45deg, var(--series-1) 0 6px, color-mix(in srgb, var(--series-1) 40%, transparent) 6px 12px); }
.tl-bar.mvn { top: 21px; height: 4px; background: var(--series-2); border-radius: 2px; z-index: 1; }
.tl-row.step.has-mvn .tl-label, .tl-row.step.has-mvn .tl-track { min-height: 34px; }
.tl-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--grid); }
.tl-axis { position: relative; height: 22px; border-bottom: 1px solid var(--grid); }
.tl-axis .t { position: absolute; top: 3px; font-size: 11px; color: var(--muted); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.tl-axis-label { padding: 0 12px; display: flex; align-items: center; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--grid); position: sticky; left: 0; background: var(--surface); z-index: 1; }
.tl-tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--page); padding: 6px 9px; border-radius: 6px; font-size: 12px; max-width: 360px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.tl-tip b { font-size: 13px; }
.tl-tip .row { display: flex; gap: 10px; justify-content: space-between; }

/* ---- report viewer (context bar + iframe fill the viewport) ------------------- */
body.viewer-mode, body.viewer-mode #app { height: 100vh; height: 100dvh; overflow: hidden; }
body.viewer-mode header.top, body.viewer-mode footer { display: none; }
body.viewer-mode main { padding: 0; max-width: none; margin: 0; height: 100%; }
.viewer { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.viewer-bar { flex: 0 0 auto; display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface); font-size: 13px; }
.viewer-bar .back { font-weight: 600; }
.viewer-bar .ctx { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; color: var(--ink-2); min-width: 0; }
.viewer-bar .ctx b { color: var(--ink); }
.viewer-bar .ctx .sep { opacity: 0.5; }
.viewer-bar .links { margin-left: auto; display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; }
.viewer-bar select { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 2px 6px; }
.viewer-frame { flex: 1 1 auto; position: relative; min-height: 0; background: var(--page); }
.viewer-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.viewer-frame .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); pointer-events: none; }
.viewer-frame .loading.done { display: none; }
@media (max-width: 700px) { .viewer-bar .links { margin-left: 0; } }

/* ---- misc ------------------------------------------------------------------ */
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 6px 18px; font-size: 13px; }
.kv div { display: flex; flex-direction: column; min-width: 0; }
.kv .k { color: var(--muted); font-size: 11.5px; }
.kv .v { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.inline-list { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.small { font-size: 12px; }

</style>

      var expanded = false;

      function setOpen(v) { expanded = v; btn.textContent = (v ? '▾ ' : '▸ ') + plural(j.steps.length, 'step'); btn.setAttribute('aria-expanded', String(v)); stepRows.forEach(function (tr) { tr.className = 'step-row' + (v ? '' : ' hidden'); }); }

      body.appendChild(h('tr', null, [

        h('td', null, jobEntries.length ? h('span', { class: 'inline-list' }, entryChips(jobEntries).map(function (c) { c.title = (c.title || '') + ' (step unknown)'; return c; })) : ''),
        h('td', null, extLink(M.jobUrl(r, j, CTX), 'GitHub job ↗')),

          h('td', null, ents.length ? h('span', { class: 'inline-list' }, entryChips(ents)) : ''),
          h('td', null, extLink(M.stepUrl(r, j, s.number, CTX), 'step ↗', 'small', 'The step log on GitHub')),

    });

      body.appendChild(h('tr', null, [
        h('td', { class: 'dim', text: 'mvn-lens reports not attributed to a job' }), h('td'), h('td'), h('td'),

      ]));
    }

    var tools = h('div', { class: 'table-tools' }, [
      h('button', { type: 'button', class: 'tgl', text: 'Expand all', onclick: function () { groups.forEach(function (f) { f(true); }); } }),
      h('button', { type: 'button', class: 'tgl', text: 'Collapse all', onclick: function () { groups.forEach(function (f) { f(false); }); } }),
    ]);
    return h('div', null, [tools, h('div', { class: 'table-wrap' }, h('table', null, [
      h('thead', null, h('tr', null, ['Job / step', 'Status', 'Duration', 'Runner / started', 'mvn-lens', ''].map(function (t) { return h('th', { class: t === 'Duration' ? 'num' : null, text: t }); }))),
      body,
    ]))]);
  }

  /** HTML/CSS Gantt: label column + proportional bars, tooltip on hover (from build-dashboard). */
  function timeline(r) {
    var showSkipped = false;
    var wrap = h('div', { class: 'timeline' });
    var toolbar = h('div', { class: 'tl-toolbar' });
    var cb = h('input', { type: 'checkbox', onchange: function () { showSkipped = cb.checked; draw(); } });
    toolbar.appendChild(h('label', null, [cb, 'Show skipped steps']));
    toolbar.appendChild(h('span', { class: 'inline-list' }, [
      h('span', { class: 'item legend' }, [h('span', { class: 'sw rect', style: { background: cssVar('--bar-success') } }), 'success']),
      h('span', { class: 'item legend' }, [h('span', { class: 'sw rect', style: { background: cssVar('--critical') } }), 'failure']),
      h('span', { class: 'item legend' }, [h('span', { class: 'sw rect', style: { background: cssVar('--muted') } }), 'cancelled']),
      h('span', { class: 'item legend' }, [h('span', { class: 'sw rect', style: { background: 'repeating-linear-gradient(45deg, ' + cssVar('--series-1') + ' 0 3px, transparent 3px 6px)' } }), 'running']),
      h('span', { class: 'item legend' }, [h('span', { class: 'sw rect', style: { background: cssVar('--series-2'), height: '4px' } }), 'Maven session (mvn-lens)']),
    ]));
    wrap.appendChild(toolbar);
    var scroll = h('div', { class: 'tl-scroll' });
    wrap.appendChild(scroll);
    var idx = entriesByJobStep(r);

    function draw() {
      clear(scroll);
      var t0 = r.startedMs, t1 = r.completedMs || 0;
      r.jobs.forEach(function (j) {
        if (j.startedMs && j.startedMs < t0) t0 = j.startedMs;
        if (j.completedMs && j.completedMs > t1) t1 = j.completedMs;
        j.steps.forEach(function (s) { if (s.completedMs && s.completedMs > t1) t1 = s.completedMs; });
      });
      if (!t1 || t1 <= t0) t1 = Math.max(t0 + 1000, Date.now());
      var span = t1 - t0;
      var grid = h('div', { class: 'tl-grid' });
      var axis = h('div', { class: 'tl-axis' });
      var step = niceTick(span);
      for (var t = 0; t <= span; t += step) axis.appendChild(h('span', { class: 't', style: { left: (100 * t / span) + '%' }, text: M.formatSecAxis(t / 1000) }));
      grid.appendChild(h('div', { class: 'tl-axis-label', text: 'elapsed' }));
      grid.appendChild(axis);

      function track(bars) {
        var tr = h('div', { class: 'tl-track' });
        for (var t = step; t < span; t += step) tr.appendChild(h('span', { class: 'tl-tick', style: { left: (100 * t / span) + '%' } }));
        bars.forEach(function (b) { tr.appendChild(b); });
        return tr;
      }
      function bar(start, end, cls, tip) {
        if (!start) return null;
        var e = end || Date.now();
        var left = Math.max(0, 100 * (start - t0) / span);
        var width = Math.max(0.15, 100 * (e - start) / span);
        var el = h('div', { class: 'tl-bar ' + cls, style: { left: left + '%', width: Math.min(width, 100 - left) + '%' }, role: 'img', 'aria-label': tip().textContent });
        attachTip(el, tip);
        return el;
      }
      r.jobs.forEach(function (j) {
        var jstate = M.jobState(j);
        var jl = h('div', { class: 'tl-label' }, [
          h('span', { class: 'name', title: j.name }, extLink(M.jobUrl(r, j, CTX), j.name)),
          j.labels && j.labels.length ? h('span', { class: 'dim small', text: j.labels.join(', ') }) : null,
          h('span', { class: 'dur', text: fmtMs(j.durationMs) }),
        ]);
        grid.appendChild(h('div', { class: 'tl-row job' }, [jl, track([bar(j.startedMs, j.completedMs, jstate, function () { return tipContent(j.name, j.startedMs, j.completedMs, j.durationMs, M.stateLabel(jstate), (j.runnerName ? 'Runner: ' + j.runnerName : null)); })].filter(Boolean))]));
        j.steps.forEach(function (s) {
          if (!showSkipped && s.conclusion === 'skipped') return;
          var sstate = M.jobState(s);
          var ents = idx.byJobStep[j.id + ':' + s.number] || [];
          var sl = h('div', { class: 'tl-label' }, [h('span', { class: 'name', title: s.name, text: s.name }), entryChips(ents), h('span', { class: 'dur', text: fmtMs(s.durationMs) })]);
          var bars = [bar(s.startedMs, s.completedMs, sstate, function () { return tipContent(s.name, s.startedMs, s.completedMs, s.durationMs, M.stateLabel(sstate), null); })];
          ents.forEach(function (it) {
            var sm = it.entry.summary;
            if (sm && sm.startedAt && sm.endedAt) {
              var a = Math.max(sm.startedAt, s.startedMs || sm.startedAt), b = Math.min(sm.endedAt, s.completedMs || sm.endedAt);
              if (b > a) bars.push(bar(a, b, 'mvn', function () { return tipContent('Maven ' + (sm.goals || []).join(' '), sm.startedAt, sm.endedAt, sm.totalMs || sm.wallMs, sm.status || '', (sm.moduleCount != null ? sm.moduleCount + ' module(s) · ' : '') + (sm.threads > 1 ? '-T' + sm.threads + ' ' : '') + (sm.builderId || '')); }));
            }
          });
          grid.appendChild(h('div', { class: 'tl-row step' + (ents.length ? ' has-mvn' : '') }, [sl, track(bars.filter(Boolean))]));
        });
      });
      if (!r.jobs.length) grid.appendChild(h('div', { class: 'tl-label', style: { gridColumn: '1 / -1' }, text: 'No job information was recorded for this run.' }));
      if (idx.unattributed.length) {
        grid.appendChild(h('div', { class: 'tl-row step' }, [h('div', { class: 'tl-label' }, [h('span', { class: 'name', text: 'mvn-lens reports not attributed to a step' })]), h('div', { class: 'tl-track', style: { padding: '4px 8px' } }, entryChips(idx.unattributed))]));
      }

  }
  function niceTick(spanMs) {
    var steps = [1000, 2000, 5000, 10000, 15000, 30000, 60000, 120000, 300000, 600000, 900000, 1800000, 3600000, 7200000, 4 * 3600000, 8 * 3600000, 12 * 3600000, 24 * 3600000];

  }
  function tipContent(name, start, end, dur, state, extra) {
    return h('div', null, [h('b', { text: name }), h('div', { class: 'row' }, [h('span', { text: 'Duration' }), h('span', { text: fmtMs(dur) })]), h('div', { class: 'row' }, [h('span', { text: 'Started' }), h('span', { text: start ? new Date(start).toLocaleTimeString() : '—' })]), h('div', { class: 'row' }, [h('span', { text: 'Ended' }), h('span', { text: end ? new Date(end).toLocaleTimeString() : 'running' })]), state ? h('div', { class: 'row' }, [h('span', { text: 'Status' }), h('span', { text: state })]) : null, extra ? h('div', { class: 'dim', text: extra }) : null]);
  }
  var tipEl = null;
  function attachTip(el, content) {
    function show(ev) {

      clear(tipEl); tipEl.appendChild(content()); move(ev); tipEl.style.display = 'block';
    }
    function move(ev) { if (!tipEl) return; var x = ev.clientX + 14, y = ev.clientY + 14; if (x + 300 > window.innerWidth) x = ev.clientX - 310; tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; }
    function hide() { if (tipEl) tipEl.style.display = 'none'; }
    el.addEventListener('mouseenter', show); el.addEventListener('mousemove', move); el.addEventListener('mouseleave', hide);
    el.setAttribute('tabindex', '0'); el.addEventListener('focus', function () { var b = el.getBoundingClientRect(); show({ clientX: b.left, clientY: b.bottom }); }); el.addEventListener('blur', hide);
  }

  // ------------------------------------------------------------------------
  // Pending / error states
  // ------------------------------------------------------------------------
  function monitorWorkflowPath() {
    var ids = Object.keys(WORKFLOWS);
    for (var i = 0; i < ids.length; i++) {
      var w = WORKFLOWS[ids[i]];
      var base = w.path ? String(w.path).split('/').pop() : '';
      if (base === 'build-monitor.yml' || /build[ _-]?monitor/i.test(w.name || '')) return w.path;
    }
    return '.github/workflows/build-monitor.yml';
  }
  /** Unknown run/report id: the run is probably still being processed. Re-checks data/history.json every 30 s. */
  function viewPending(route) {
    var what = route.name === 'report' ? 'Report ' + route.key + ' of run ' + route.runId : 'Run ' + route.runId;
    var runLink = M.githubRunUrl(CTX, route.runId);
    var wfLink = M.workflowUrl(CTX, monitorWorkflowPath());
    var status = h('p', { class: 'dim small', id: 'bm-poll-status', text: pollStatusText() });
    return h('div', null, [
      crumbs([['#/reports', 'mvn-lens reports'], [null, what]]),
      h('div', { class: 'notice' }, [
        h('h2', { text: 'Waiting for the Build monitor workflow' }),
        h('p', { text: what + ' is not in the history yet. The history is refreshed by the Build monitor workflow once the run completes; GitHub Pages can take a few more minutes to publish it.' }),
        h('div', { class: 'links' }, [
          runLink ? extLink(runLink, 'Open the run on GitHub ↗') : null,
          wfLink ? extLink(wfLink, 'Build monitor workflow ↗') : null,
          link('#/reports', 'All reports'), link('#/builds', 'Builds'),
        ]),
        status,
      ]),
    ]);
  }
  function viewLoadError(err) {
    var body;
    if (err.kind === 'file') {
      body = [
        h('h2', { text: 'Opened from the file system' }),
        h('p', { text: 'Browsers do not let a page read ' + HISTORY_FILE + ' over file: URLs. Serve the site directory over HTTP and open it from there, for example:' }),
        h('pre', { text: 'node scripts/serve.js <site-dir>\n# then open the printed URL, e.g. http://127.0.0.1:8787/' }),
        h('p', { class: 'dim small', text: 'The published site (GitHub Pages) does not have this limitation.' }),
      ];
    } else if (err.kind === '404') {
      body = [
        h('h2', { text: 'No history published yet' }),
        h('p', { text: HISTORY_FILE + ' does not exist on this site. It is written by the Build monitor workflow once a monitored workflow run completes (or when you run the Build monitor workflow manually).' }),
        h('p', { class: 'dim small', id: 'bm-poll-status', text: pollStatusText() }),
      ];
    } else {
      body = [
        h('h2', { text: 'Could not load the history' }),

  }

  var poll = { timer: null, lastAt: null, lastResult: null, active: false, count: 0, route: null, gaveUp: false };
  function pollStatusText() {
    if (location.protocol === 'file:') return 'Automatic refresh is not possible from the file system — reload the page once the history has been published.';
    if (poll.gaveUp) {
      return 'Stopped checking ' + HISTORY_FILE + ' after ' + MAX_POLLS + ' attempts (' + Math.round(MAX_POLLS * POLL_MS / 60000) + ' min). '
        + 'Some runs never reach the history: a run of a pull request from a fork cannot publish a report (its token is read-only), '
        + 'and a run of a workflow the Build monitor does not monitor is never ingested. '
        + 'Open the run on GitHub with the link above to check it, then reload this page.';
    }
    var t = 'Checking ' + HISTORY_FILE + ' every ' + Math.round(POLL_MS / 1000) + ' s';
    if (poll.lastAt) t += ' · last check ' + new Date(poll.lastAt).toLocaleTimeString() + (poll.lastResult ? ' (' + poll.lastResult + ')' : '');
    return t + '.';
  }
  function routeResolves(route, model) {
    if (route.name === 'run') return !!model.byId[route.runId];
    if (route.name === 'report') { var r = model.byId[route.runId]; return !!(r && r.mvnLens.some(function (e) { return e.key === route.key; })); }
    return true;
  }
  /**
   * Polls data/history.json while a pending view is shown. It gives up after
   * MAX_POLLS fruitless checks: a run of a fork pull request or of an
   * unmonitored workflow is never ingested, and such a page would poll forever.
   * The counter is per pending route, so another unknown run starts fresh.
   */
  function startPolling(route) {
    var key = route ? M.routeHash(route) : '';
    if (poll.route !== key) { poll.route = key; poll.count = 0; poll.gaveUp = false; }
    if (poll.active || poll.gaveUp) return;
    poll.active = true;
    poll.timer = setInterval(function () {
      if (!poll.active) return;                    // stopped between two ticks
      fetchHistory('no-store').then(function (raw) {
        poll.lastAt = Date.now();
        var route = M.parseRoute(location.hash);
        var model = M.normalize(raw);
        if (!DATA || routeResolves(route, model) || model.runs.length !== RUNS.length || model.generatedAt !== DATA.generatedAt) {
          poll.lastResult = 'updated';
          boot(raw); SOURCE = 'fetch';
          render();
        } else {
          poll.lastResult = 'not there yet';
          countFruitlessPoll();
        }
      }, function (e) {
        poll.lastAt = Date.now();
        poll.lastResult = e && e.kind === '404' ? 'not published yet' : ('error: ' + (e && e.message || e));
        countFruitlessPoll();
      });
    }, POLL_MS);
  }
  function countFruitlessPoll() {
    poll.count++;
    if (poll.count >= MAX_POLLS) { stopPolling(); poll.gaveUp = true; }
    updatePollStatus();
  }
  function stopPolling() { if (poll.timer) clearInterval(poll.timer); poll.timer = null; poll.active = false; }
  function updatePollStatus() { var el = document.getElementById('bm-poll-status'); if (el) el.textContent = pollStatusText(); }

  // ------------------------------------------------------------------------
  // Shell + router
  // ------------------------------------------------------------------------
  function crumbs(items) {
    var el = h('div', { class: 'crumbs' });
    items.forEach(function (it, i) { if (i) el.appendChild(h('span', { class: 'sep', text: '›' })); el.appendChild(it[0] ? link(it[0], it[1]) : h('span', { text: it[1] })); });
    return el;
  }
  var navEl = null;
  function shell() {
    var app = document.getElementById('app');
    clear(app);
    var nav = h('nav', null, [h('a', { href: '#/reports', 'data-route': 'reports', text: 'mvn-lens reports' }), h('a', { href: '#/builds', 'data-route': 'builds', text: 'Builds' })]);
    var reportsCount = DATA && DATA.stats && DATA.stats.reportsCount !== null ? DATA.stats.reportsCount : null;
    app.appendChild(h('header', { class: 'top' }, [
      h('div', { class: 'brand' }, [link('#/reports', BASE_TITLE, 'title'), REPO ? h('span', { class: 'repo' }, REPO_URL ? extLink(REPO_URL, REPO) : REPO) : null]),
      nav,
      h('div', { class: 'meta', title: DATA && DATA.generatedAt ? DATA.generatedAt : '' }, [
        'Updated ' + (DATA && DATA.generatedMs ? M.formatRel(DATA.generatedMs) + ' · ' + fmtDate(DATA.generatedMs) : '—'),
        h('br'),
        h('span', { text: plural(RUNS.length, 'run') + (reportsCount !== null ? ' · ' + plural(reportsCount, 'report') + (DATA.stats.reportsBytes ? ' (' + M.formatBytes(DATA.stats.reportsBytes) + ')' : '') : '') }),
      ]),
    ]));
    app.appendChild(h('main', { id: 'view' }));
    app.appendChild(h('footer', null, ['Generated by ', extLink('https://github.com/mvn-perf/build-monitor', 'mvn-perf/build-monitor'), ' · ', link(HISTORY_FILE, 'history.json'), SOURCE === 'inline' ? ' (inlined)' : '']));
    return nav;

  function render(opts) {

    clear(view);

        else { content = viewPending(route); pending = true; title = 'Run ' + route.runId + ' (pending) · ' + BASE_TITLE; }
      } else if (route.name === 'report') {

        if (run && entry) { content = viewViewer(route, run, entry); viewerMode = true; title = entryTitle(entry) + ' #' + run.runNumber + ' · mvn-lens report · ' + BASE_TITLE; }
        else { content = viewPending(route); pending = true; title = 'Report (pending) · ' + BASE_TITLE; }
      } else if (route.name === 'builds') {
        content = viewBuilds(); title = 'Builds · ' + BASE_TITLE;

    document.title = title;

    if (o.focus) { var f = document.getElementById(o.focus); if (f) { try { f.focus(); var n = f.value.length; f.setSelectionRange(n, n); } catch (e) { /* ignore */ } } }
    else { try { window.scrollTo(0, 0); } catch (e) { /* non-browser environments */ } }
  }

  function start() {
    loadData().then(function (res) {
      boot(res.data); SOURCE = res.source;
    }, function (err) {

  start();
})();
